services:
  - type: web
    name: equa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT web.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: KAKEIBO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: equa-db
          property: connectionString

databases:
  - name: equa-db
    plan: free
